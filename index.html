<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Switch Configurator — APK.audio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span>🖧</span>
      <span>Network Switch Configurator</span>
      <span style="font-size:0.75rem; background:#1e293b; color:#38bdf8; padding:2px 8px; border-radius:12px;">Managed AV Switch</span>
    </div>
    <div>
      <button class="primary" id="btn-export">Export Config</button>
    </div>
  </header>

  <div class="main-view">
    <div class="switch-chassis">
      <div class="switch-bezel">
        <div class="switch-info">
          <div>
            <div style="font-weight:700; font-size:1.1rem; color:#f1f5f9;">AV-CORE-SW01</div>
            <div style="font-size:0.8rem; color:#64748b;">Enterprise 24-Port Gigabit AVB/Dante Switch</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.8rem; color:#94a3b8;">PoE Power Draw: <span id="poe-total" style="color:#38bdf8; font-weight:700;">184.8 W / 370 W</span></div>
            <div style="font-size:0.75rem; color:#10b981;">● System Normal · LLDP Active</div>
          </div>
        </div>

        <div class="ports-grid" id="ports-grid"></div>
      </div>
    </div>

    <div class="side-panel">
      <h3 style="font-size:0.85rem; text-transform:uppercase; color:#94a3b8; margin-bottom:16px;">Port Configuration</h3>
      <div id="inspector">
        <div style="color:#64748b; font-size:0.85rem;">Click a port to configure its profile, VLAN, and PoE parameters.</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { SwitchModel } from './js/switchApp.js';

    const model = new SwitchModel(24);
    const grid = document.getElementById('ports-grid');
    const inspector = document.getElementById('inspector');
    const poeTotal = document.getElementById('poe-total');
    let selectedPort = null;

    function renderGrid() {
      grid.innerHTML = '';
      model.ports.forEach(p => {
        const slot = document.createElement('div');
        slot.className = `port-slot ${p.link ? 'link-up' : ''} ${selectedPort?.id === p.id ? 'selected' : ''}`;
        slot.innerHTML = `
          <div class="port-led ${p.link ? 'active' : ''}"></div>
          <div class="port-num">${p.id}</div>
          <div class="port-vlan">V${p.vlan}</div>
        `;
        slot.addEventListener('click', () => {
          selectedPort = p;
          renderGrid();
          renderInspector();
        });
        grid.appendChild(slot);
      });
      poeTotal.textContent = `${model.getTotalPoeBudget().toFixed(1)} W / 370 W`;
    }

    function renderInspector() {
      if (!selectedPort) return;
      inspector.innerHTML = `
        <div class="prop-group">
          <label>Port Interface</label>
          <input type="text" value="${selectedPort.name}" disabled />
        </div>
        <div class="prop-group">
          <label>AV Profile</label>
          <select id="sel-profile">
            <option value="Dante Audio" ${selectedPort.profile === 'Dante Audio' ? 'selected' : ''}>Dante Audio (QoS Expedited)</option>
            <option value="AES67 Control" ${selectedPort.profile === 'AES67 Control' ? 'selected' : ''}>AES67 Control</option>
            <option value="Video NDI" ${selectedPort.profile === 'Video NDI' ? 'selected' : ''}>Video NDI / SMPTE 2110</option>
            <option value="Default Data" ${selectedPort.profile === 'Default Data' ? 'selected' : ''}>Default Data</option>
          </select>
        </div>
        <div class="prop-group">
          <label>VLAN Tag (1 - 4094)</label>
          <input type="number" id="inp-vlan" value="${selectedPort.vlan}" min="1" max="4094" />
        </div>
        <div class="prop-group">
          <label>PoE Power (802.3at)</label>
          <button id="btn-poe" style="width:100%; border-color:${selectedPort.poe ? '#34d399' : '#475569'}; color:${selectedPort.poe ? '#34d399' : '#94a3b8'};">
            ${selectedPort.poe ? '✓ PoE Enabled (15.4W Allocated)' : '✕ PoE Disabled'}
          </button>
        </div>
      `;

      document.getElementById('sel-profile').addEventListener('change', (e) => {
        model.setPortProfile(selectedPort.id, e.target.value);
        renderGrid();
      });

      document.getElementById('inp-vlan').addEventListener('change', (e) => {
        model.setPortVlan(selectedPort.id, e.target.value);
        renderGrid();
      });

      document.getElementById('btn-poe').addEventListener('click', () => {
        model.togglePoe(selectedPort.id);
        renderGrid();
        renderInspector();
      });
    }

    document.getElementById('btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(model, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'switch-config-AV-CORE-SW01.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    renderGrid();
  </script>
</body>
</html>
